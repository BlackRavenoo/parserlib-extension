<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>ParserLib</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 320px; padding: 12px; }
    label { display: block; margin-top: 8px; font-size: 12px; color: #555; }
    select, button { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
    button { margin-top: 10px; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.5; }
    #source { margin-top: 4px; padding: 6px 0; }
  </style>
</head>
<body>
  <div id="source">Определяю страницу…</div>

  <label for="format">Формат</label>
  <!-- Options are populated at runtime from src/export/registry.ts -->
  <select id="format"></select>

  <button id="start" disabled>Скачать</button>

  <script type="module" src="./popup.js"></script>
</body>
</html>
