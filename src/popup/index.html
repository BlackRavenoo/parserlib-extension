<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>ParserLib</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 340px; padding: 12px; }
    label { display: block; margin-top: 10px; font-size: 12px; color: #555; }
    select, button, input[type="file"] { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
    button { margin-top: 12px; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.5; }
    #source { margin: 4px 0 8px; overflow-wrap: anywhere; }
    #range { display: block; }
    #status { color: #555; white-space: pre-wrap; }
    #status.error { color: #b00020; }
    #chapter-count { margin: 4px 0 0; color: #666; font-size: 12px; }
    .checkbox { display: flex; align-items: center; gap: 6px; }
    .checkbox input { margin: 0; flex-shrink: 0; }
    #volumes { margin: 10px 0 0; padding: 6px 8px 8px; border: 1px solid #ccc; border-radius: 4px; }
    #volumes legend { font-size: 12px; color: #555; }
    #volumes .checkbox { margin-top: 4px; }
    #volume-list { max-height: 100px; overflow-y: auto; overflow-wrap: anywhere; }
    #append-file-row p { margin: 4px 0 0; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div id="source">Определяю страницу…</div>
  <div id="status" role="status"></div>
  <form id="settings-form" hidden>
    <label for="branch">Ветка перевода</label>
    <select id="branch" required disabled></select>
    <fieldset id="volumes" disabled>
      <legend>Тома</legend>
      <label class="checkbox"><input id="volumes-all" type="checkbox" />Все тома</label>
      <div id="volume-list"></div>
    </fieldset>
    <label for="format">Формат</label>
    <select id="format"></select>
    <div id="append-option" hidden>
      <label class="checkbox" for="append-enabled">
        <input id="append-enabled" type="checkbox" />
        Докачать существующий файл
      </label>
      <div id="append-file-row" hidden>
        <label for="append-file">Файл</label>
        <input id="append-file" type="file" accept=".fb2" />
      </div>
    </div>
    <div id="range">
      <label for="range-from">С главы
        <select id="range-from" required disabled></select>
      </label>
      <label for="range-to">По главу
        <select id="range-to" required disabled></select>
      </label>
    </div>
    <p id="chapter-count"></p>
    <button id="start" type="submit" disabled>Скачать</button>
  </form>
  <script type="module" src="./popup.js"></script>
</body>
</html>
